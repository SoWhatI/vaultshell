name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      # node-pty 的 prebuilds tarball 里 spawn-helper 可能丢执行位（posix_spawnp
      # failed），npm 解包不会恢复——这里显式补回，保证 macOS 上跑到真实 PTY 路径。
      - run: chmod +x node_modules/node-pty/prebuilds/*/spawn-helper 2>/dev/null || true
      # 会话测试内置 node-pty 真实 spawn 能力探测：PTY 不可用（如 Linux 上原生
      # 构建失败）时自动走 child_process 降级路径断言，不会误判失败。
      - run: npx vitest run
